pid /opt/logagent-native/nginx.pid;
events {}
http {
    access_log off;
    error_log /opt/logagent-native/nginx-error.log warn;
    server {
        listen 3000;
        root /opt/logagent/frontend/dist;
        index index.html;
        location /api/ {
            proxy_pass http://127.0.0.1:4300;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }
        location ~ ^/(docs|redoc|openapi\.json)(/|$) {
            proxy_pass http://127.0.0.1:4300;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
