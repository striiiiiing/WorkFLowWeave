name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/striiiiiing/workflowweave

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:runtime
            ${{ env.IMAGE_PREFIX }}-backend:runtime-${{ github.sha }}
          cache-from: type=gha,scope=workflowweave-runtime
          cache-to: type=gha,mode=max,scope=workflowweave-runtime
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: |
            type=gha,scope=workflowweave-runtime
            type=gha,scope=workflowweave-backend
          cache-to: type=gha,mode=max,scope=workflowweave-backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=workflowweave-frontend
          cache-to: type=gha,mode=max,scope=workflowweave-frontend
