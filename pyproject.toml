[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "logagent"
version = "0.1.0"
description = "Configurable asynchronous collection for LogAgent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosmtplib>=3,<6",
  "aiosqlite>=0.20,<0.22",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema[format]>=4.23,<5",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-sqlite>=2,<3",
  "orjson>=3.12.0",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
logagent = "logagent.interaction.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/logagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
