schema: spec-driven

context: |
  WorkFLowWeave 是 Python 3.11+ 异步采集与 AI 分析服务，前端使用 Vue 3。
  文档使用中文；Requirement、Scenario 和增量标题保留 OpenSpec 标准格式。
  存放与活动范围见 openspec/README.md。
  specs 保存现行能力契约；changes 保存真正未完成的变更与验收。
  仅将已完成且未被替代的规则同步到主规范；不把待验收目标当作完成声明。
  当前工作区运行数据只使用 config 指定的 data；plugins 是用户扩展入口。

rules:
  proposal:
    - 一个独立目标一个变更，说明受影响的 capability。
  specs:
    - 描述可观察行为和验收场景；保留现有 capability 身份。
    - 依据已确认设计，不因实现差异反向修改需求。
  design:
    - 保留必要的决策与取舍，避免复制现行规范和执行流水。
  tasks:
    - 仅根 tasks.md 管理进度；未完成项用编号复选框列出。
    - 已完成的执行日志通过 Git 历史查阅，不新增日期化任务或独立 progress/report。
    - 被替代或取消的方案退出活动区，不记作已完成；剩余欠账先转交再删除。
